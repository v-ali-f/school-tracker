name: Portal CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: portal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tracked files and credentials
        run: python scripts/check_repository_hygiene.py
      - name: Check whitespace
        run: git diff --check

  tests-and-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: school_portal_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d school_portal_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FLASK_ENV: production
      SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgresql+psycopg2://postgres:ci-only-password@127.0.0.1:5432/school_portal_ci
      AUTO_SCHEMA_BOOTSTRAP: "0"
      KUBOK_SCHEDULER_DISABLED: "1"
      UPLOAD_FOLDER: /tmp/altair-ci/uploads
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install system libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libcairo2 libmagic1 libpango-1.0-0 libpangoft2-1.0-0
          shared-mime-info
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile application
        run: python -m compileall -q app migrations
      - name: Validate and apply migration chain
        run: |
          python -m flask --app run:app db heads
          python -m flask --app run:app db upgrade
          python -m flask --app run:app db current
      - name: Run full test suite
        run: python -m pytest -q
