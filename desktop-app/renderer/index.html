<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Альтаир</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="login-view" id="loginView" hidden>
      <div class="login-panel">
        <img class="login-logo" src="../assets/icon.png" alt="Альтаир">
        <h1>Альтаир</h1>
        <p class="brand-slogan">Единая цифровая система управления школой</p>
        <form id="loginForm" class="login-form">
          <label>
            <span>Логин</span>
            <input id="username" name="username" autocomplete="username" required>
          </label>
          <label>
            <span>Пароль</span>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </label>
          <button type="submit">Войти</button>
          <p class="form-message" id="loginMessage"></p>
        </form>
      </div>
    </section>

    <section class="shell-view" id="shellView" hidden>
      <aside class="sidebar">
        <div>
          <img class="sidebar-logo" src="../assets/altair-logo-white.svg" alt="Альтаир">
        </div>
        <nav class="nav">
          <button class="nav-item is-active" data-section="overview">Обзор</button>
          <button class="nav-item" data-section="notifications">Уведомления</button>
          <button class="nav-item" data-section="incidents">Инциденты</button>
          <button class="nav-item" data-section="newIncident">Добавить</button>
        </nav>
        <button class="ghost-button" id="openPortalButton">Открыть портал</button>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <div>
            <h1 id="pageTitle">Обзор</h1>
            <p id="userCaption">Проверяем вход</p>
          </div>
          <div class="topbar-actions">
            <button class="secondary-button" id="refreshButton">Обновить</button>
            <button class="ghost-button" id="logoutButton">Выйти</button>
          </div>
        </header>

        <p class="status-line" id="statusLine"></p>

        <section class="content-section" id="overviewSection">
          <div class="metric-grid">
            <article class="metric">
              <span>Новые уведомления</span>
              <strong id="unreadCount">0</strong>
            </article>
            <article class="metric">
              <span>Последние инциденты</span>
              <strong id="incidentCount">0</strong>
            </article>
            <article class="metric">
              <span>Доступ к добавлению</span>
              <strong id="incidentAccess">-</strong>
            </article>
          </div>

          <div class="two-column">
            <section class="panel">
              <div class="panel-heading">
                <h2>Последние уведомления</h2>
                <button class="text-button" data-section-jump="notifications">Все</button>
              </div>
              <div class="list" id="overviewNotifications"></div>
            </section>
            <section class="panel">
              <div class="panel-heading">
                <h2>Последние инциденты</h2>
                <button class="text-button" data-section-jump="incidents">Все</button>
              </div>
              <div class="list" id="overviewIncidents"></div>
            </section>
          </div>
        </section>

        <section class="content-section" id="notificationsSection" hidden>
          <section class="panel">
            <div class="panel-heading">
              <h2>Уведомления</h2>
              <span class="muted" id="notificationTotal"></span>
            </div>
            <div class="list" id="notificationList"></div>
          </section>
        </section>

        <section class="content-section" id="incidentsSection" hidden>
          <section class="panel">
            <div class="panel-heading">
              <h2>Мои инциденты</h2>
              <span class="muted" id="incidentTotal"></span>
            </div>
            <div class="list" id="incidentList"></div>
          </section>
        </section>

        <section class="content-section" id="newIncidentSection" hidden>
          <section class="form-panel">
            <h2>Новый инцидент</h2>
            <form id="incidentForm" class="incident-form">
              <div class="form-row">
                <label>
                  <span>Дата</span>
                  <input id="incidentDate" name="occurred_date" type="date" required>
                </label>
                <label>
                  <span>Время</span>
                  <input id="incidentTime" name="occurred_time" type="time" required>
                </label>
                <label>
                  <span>Категория</span>
                  <select id="incidentCategory" name="category" required></select>
                </label>
              </div>

              <label>
                <span>Описание</span>
                <textarea id="incidentDescription" name="description" rows="5" required></textarea>
              </label>

              <div class="form-row">
                <label>
                  <span>Класс</span>
                  <select id="classSelect"></select>
                </label>
              </div>

              <div class="student-picker" id="studentPicker">
                <div class="picker-toolbar">
                  <input id="studentSearch" placeholder="Поиск ученика">
                  <span id="studentCounter">Выберите класс</span>
                </div>
                <div class="student-list" id="studentList"></div>
              </div>

              <div class="form-actions">
                <button type="submit">Сохранить инцидент</button>
                <button type="button" class="secondary-button" id="clearIncidentButton">Очистить</button>
              </div>
              <p class="form-message" id="incidentMessage"></p>
            </form>
          </section>
        </section>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
