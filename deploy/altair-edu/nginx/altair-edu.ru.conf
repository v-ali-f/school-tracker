upstream school_tracker_backend {
    server 10.99.0.2:80;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name altair-edu.ru www.altair-edu.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://altair-edu.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.altair-edu.ru;

    ssl_certificate /etc/letsencrypt/live/altair-edu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altair-edu.ru/privkey.pem;

    return 301 https://altair-edu.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name altair-edu.ru;

    ssl_certificate /etc/letsencrypt/live/altair-edu.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altair-edu.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 200m;
    keepalive_timeout 65;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        proxy_pass http://school_tracker_backend;
        proxy_http_version 1.1;
        proxy_set_header Host altair-edu.ru;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 10;
        proxy_send_timeout 120;
        proxy_read_timeout 120;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
