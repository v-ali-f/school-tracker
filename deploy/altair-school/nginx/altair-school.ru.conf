server {
    listen 80;
    listen [::]:80;
    server_name altair-school.ru www.altair-school.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://altair-school.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.altair-school.ru;

    ssl_certificate /etc/letsencrypt/live/altair-school.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altair-school.ru/privkey.pem;
    return 301 https://altair-school.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name altair-school.ru;

    ssl_certificate /etc/letsencrypt/live/altair-school.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/altair-school.ru/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 200m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /uploads/ {
        alias /srv/school-tracker/uploads/;
        expires 7d;
        access_log off;
    }

    location /static/ {
        alias /srv/school-tracker/current/app/static/;
        expires 1d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180;
        proxy_connect_timeout 30;
        proxy_send_timeout 180;
    }
}
