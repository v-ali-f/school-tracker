{% extends "layout.html" %}

{% block content %}
<style>
  .preschool-shell {
    max-width: 860px;
    margin: 0 auto;
    padding: 22px 24px 40px;
  }

  .preschool-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 18px;
    margin-bottom: 18px;
  }

  .preschool-kicker {
    margin-bottom: 7px;
    color: #64748b;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em;
    text-transform: uppercase;
  }

  .preschool-title {
    margin: 0;
    font-size: 30px;
    line-height: 1.12;
    font-weight: 800;
    color: #1f2937;
    letter-spacing: -0.025em;
  }

  .preschool-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 36px;
    padding: 0 13px;
    border-radius: 12px;
    border: 1px solid #dbe3ef;
    background: #fff;
    color: #334155;
    text-decoration: none;
    font-size: 14px;
    font-weight: 750;
    white-space: nowrap;
  }

  .preschool-panel {
    padding: 18px;
    border: 1px solid #e2e8f0;
    border-radius: 20px;
    background: #fff;
    box-shadow: 0 10px 26px rgba(15, 23, 42, 0.045);
  }

  .preschool-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .preschool-field {
    margin-bottom: 11px;
  }

  .preschool-field.full {
    grid-column: 1 / -1;
  }

  .preschool-field label {
    display: block;
    margin-bottom: 5px;
    color: #475569;
    font-weight: 750;
    font-size: 13px;
  }

  .preschool-field input,
  .preschool-field select {
    width: 100%;
    min-height: 38px;
    border: 1px solid #dbe3ef;
    border-radius: 12px;
    padding: 0 11px;
    font-size: 14px;
    background: #fff;
  }

  .preschool-footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 8px;
  }

  .preschool-primary {
    border: 0;
    border-radius: 12px;
    min-height: 39px;
    padding: 0 16px;
    background: #2563eb;
    color: #fff;
    font-weight: 800;
    cursor: pointer;
  }

  .preschool-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 39px;
    padding: 0 16px;
    border-radius: 12px;
    border: 1px solid #dbe3ef;
    background: #fff;
    color: #334155;
    text-decoration: none;
    font-weight: 750;
  }

  @media (max-width: 720px) {
    .preschool-grid {
      grid-template-columns: 1fr;
    }

    .preschool-title {
      font-size: 26px;
    }
  }
</style>

<div class="preschool-shell">
  <div class="preschool-top">
    <div>
      <div class="preschool-kicker">Справочник ДОУ</div>
      <h1 class="preschool-title">Редактирование группы</h1>
    </div>

    <a class="preschool-back" href="{{ url_for('preschool.groups', academic_year_id=group.academic_year_id) }}">← Назад</a>
  </div>

  <form class="preschool-panel" method="post">
    <div class="preschool-grid">
      <div class="preschool-field">
        <label>Учебный год</label>
        <select name="academic_year_id">
          {% for year in all_years %}
            <option value="{{ year.id }}" {% if year.id == group.academic_year_id %}selected{% endif %}>{{ year.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="preschool-field">
        <label>Здание</label>
        <select name="building_id">
          <option value="">Не выбрано</option>
          {% for building in buildings %}
            <option value="{{ building.id }}" {% if building.id == group.building_id %}selected{% endif %}>{{ building.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="preschool-field">
        <label>Название группы</label>
        <input name="name" value="{{ group.name }}" required>
      </div>

      <div class="preschool-field">
        <label>Возрастная группа</label>
        <select name="age_level">
          <option value="">Не выбрана</option>
          {% for age_level in age_levels %}
            <option value="{{ age_level }}" {% if age_level == group.age_level %}selected{% endif %}>{{ age_level }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="preschool-field full">
        <label>Воспитатель из пользователей</label>
        <select name="teacher_user_id">
          <option value="">Не выбран</option>
          {% for teacher in teachers %}
            <option value="{{ teacher.id }}" {% if teacher.id == group.teacher_user_id %}selected{% endif %}>
              {{ teacher.last_name or "" }} {{ teacher.first_name or "" }} {{ teacher.middle_name or "" }}
              {% if teacher.username %}({{ teacher.username }}){% endif %}
            </option>
          {% endfor %}
        </select>
      </div>

      <div class="preschool-field full">
        <label>Воспитатель вручную, если нет в пользователях</label>
        <input name="teacher_name" value="{{ group.teacher_name or "" }}">
      </div>
    </div>

    <div class="preschool-footer">
      <a class="preschool-secondary" href="{{ url_for('preschool.groups', academic_year_id=group.academic_year_id) }}">Отмена</a>
      <button class="preschool-primary" type="submit">Сохранить изменения</button>
    </div>
  </form>
</div>
{% endblock %}
