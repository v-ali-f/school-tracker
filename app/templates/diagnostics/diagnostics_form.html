{% extends "layout.html" %}
{% block content %}
{% set is_edit = session_obj is not none %}
<div class="page-head">
  <div class="page-title">{{ 'Редактировать диагностику' if is_edit else 'Новая диагностика' }}</div>
</div>
<div class="card soft-card"><div class="card-body">
  <form method="post" class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Название</label>
      <input class="form-control" name="title" required value="{{ session_obj.title if is_edit else '' }}">
    </div>
    <div class="col-md-3">
      <label class="form-label">Тип</label>
      <select class="form-select" name="diagnostic_type">
        {% set current_type = session_obj.diagnostic_type if is_edit else 'MCKO' %}
        {% for code, label in [('MCKO','МЦКО'), ('EKR','ЕКР'), ('FG','ФГ')] %}
          <option value="{{ code }}" {% if current_type == code %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label">Параллель</label>
      <input class="form-control" type="number" name="parallel" value="{{ session_obj.parallel if is_edit and session_obj.parallel is not none else '' }}">
    </div>

    <div class="col-md-6">
      <label class="form-label">Предмет</label>
      <select class="form-select" name="education_activity_id" required>
        <option value="">Выберите из единого каталога</option>
        {% for subject in subjects or [] %}
          <option value="{{ subject.id }}" {% if is_edit and session_obj.education_activity_id == subject.id %}selected{% endif %}>{{ subject.name }}</option>
        {% endfor %}
      </select>
      <div class="form-text">Новый предмет сначала добавляется в единый реестр предметов и курсов.</div>
    </div>
    <div class="col-md-3">
      <label class="form-label">Основной день</label>
      <input class="form-control" type="date" name="date_main" value="{{ session_obj.date_main.strftime('%Y-%m-%d') if is_edit and session_obj.date_main else '' }}">
    </div>
    <div class="col-md-3">
      <label class="form-label">Резервный день</label>
      <input class="form-control" type="date" name="date_reserve" value="{{ session_obj.date_reserve.strftime('%Y-%m-%d') if is_edit and session_obj.date_reserve else '' }}">
    </div>
    <div class="col-md-6">
      <label class="form-label">Учебный год</label>
      <select class="form-select" name="academic_year_id">
        <option value="">—</option>
        {% for y in years %}
          <option value="{{ y.id }}" {% if is_edit and session_obj.academic_year_id == y.id %}selected{% endif %}>{{ y.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="col-12">
      <button class="btn btn-primary">{{ 'Сохранить' if is_edit else 'Создать' }}</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('diagnostics.detail', session_id=session_obj.id) if is_edit else url_for('diagnostics.index') }}">Отмена</a>
    </div>
  </form>
</div></div>
{% endblock %}
