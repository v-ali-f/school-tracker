<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Вход — {{ app_display_title }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}?v=20260428s95" rel="stylesheet">
</head>
<body>
<div class="login-page">
  <div class="login-shell">
    <div class="card login-card">
      <div class="row g-0">
        <div class="col-lg-7 login-side d-flex flex-column justify-content-center">
          <div class="login-brand">
            <img src="{{ org_logo_url }}" alt="Логотип организации">
            <div>
              <div class="login-title">{{ app_system_name }}</div>
            </div>
          </div>
        </div>

        <div class="col-lg-5 login-form-wrap">
          <h4 class="login-form-title mb-2">Вход в систему</h4>
          <div class="login-form-hint mb-4">Введите логин и пароль</div>

          {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
              {% for category, msg in messages %}
                <div class="alert alert-{{category}}">{{ msg }}</div>
              {% endfor %}
            {% endif %}
          {% endwith %}

          <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
              <label class="form-label">Логин</label>
              <input class="form-control form-control-lg" name="username" required>
            </div>
            <div class="mb-4">
              <label class="form-label">Пароль</label>
              <input class="form-control form-control-lg" name="password" type="password" required>
            </div>
            <button class="btn btn-primary w-100 btn-lg">Войти</button>
          </form>

          <div class="mt-3 text-center">
            <a href="{{ url_for('auth.forgot_password') }}" class="text-decoration-none small">Забыли пароль?</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
