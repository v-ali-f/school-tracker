
{% extends "layout.html" %}
{% block content %}
<div class="container-fluid py-3">
  <div class="page-head mb-3">
    <div><div class="page-title">Контроль качества данных</div><div class="page-sub">Предупреждения, влияющие на корректный расчет нагрузки.</div></div>
    <div class="page-actions"><a class="btn btn-outline-secondary btn-sm" href="{{ url_for('service_staff.analytics_dashboard') }}"><i class="bi bi-arrow-left me-1"></i>Назад</a></div>
  </div>
  <div class="card"><div class="list-group list-group-flush">{% for warning in warnings %}<div class="list-group-item"><span class="badge text-bg-{{ warning.type if warning.type in ['danger','warning','info'] else 'warning' }} me-2">{{ warning.type }}</span>{{ warning.message }}</div>{% else %}<div class="list-group-item text-muted">Проблем качества данных не обнаружено.</div>{% endfor %}</div></div>
</div>
{% endblock %}
