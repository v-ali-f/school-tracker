<form class="card soft-card card-body mb-3" method="get">
  <div class="row g-2 align-items-end">
    <div class="col-md-3">
      <label class="form-label small text-muted">Месяц плана</label>
      {% set active_period = request.args.get('period', selected_period if selected_period is defined else '') %}
      <select class="form-select" name="period">
        {% for item in month_options %}<option value="{{ item.value }}" {% if active_period == item.value %}selected{% endif %}>{{ item.label }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label class="form-label small text-muted">Направление</label>
      <select class="form-select" name="direction_id">
        <option value="">Все направления</option>
        {% for row in directions %}<option value="{{ row.id }}" {% if request.args.get('direction_id')|int == row.id %}selected{% endif %}>{{ row.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-4">
      <label class="form-label small text-muted">Поиск</label>
      <input class="form-control" type="search" name="q" value="{{ request.args.get('q', '') }}" placeholder="Название, ответственный или примечание">
    </div>
    <div class="col-md-2 d-grid"><button class="btn btn-outline-primary">Показать</button></div>
  </div>
  {% if can_manage %}
  <label class="form-check mt-2"><input class="form-check-input" type="checkbox" name="show_archived" value="1" {% if request.args.get('show_archived') == '1' %}checked{% endif %}> <span class="form-check-label small">Показывать архивные записи</span></label>
  {% endif %}
</form>
