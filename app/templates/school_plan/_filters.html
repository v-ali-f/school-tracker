<form class="card card-body mb-3" method="get">
  <div class="row g-2">
    <div class="col-md-3"><input class="form-control" type="text" name="q" value="{{ request.args.get('q','') }}" placeholder="Поиск по названию или описанию"></div>
    <div class="col-md-2">
      <select class="form-select" name="year_id">
        <option value="">Учебный год</option>
        {% for year in years %}<option value="{{ year.id }}" {% if current_args.get('year_id', '')|int==year.id %}selected{% endif %}>{{ year.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <select class="form-select" name="direction_id">
        <option value="">Направление</option>
        {% for row in directions %}<option value="{{ row.id }}" {% if current_args.get('direction_id', '')|int==row.id %}selected{% endif %}>{{ row.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <select class="form-select" name="category_id">
        <option value="">Категория</option>
        {% for row in categories %}<option value="{{ row.id }}" {% if current_args.get('category_id', '')|int==row.id %}selected{% endif %}>{{ row.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-1">
      <select class="form-select" name="status">
        <option value="">Статус</option>
        {% for value, title in status_choices %}<option value="{{ value }}" {% if request.args.get('status')==value %}selected{% endif %}>{{ title }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <select class="form-select" name="priority">
        <option value="">Важность</option>
        {% for value, title in priority_choices %}<option value="{{ value }}" {% if request.args.get('priority')==value %}selected{% endif %}>{{ title }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <div class="row g-2 mt-1">
    <div class="col-md-2">
      <select class="form-select" name="building_id">
        <option value="">Здание</option>
        {% for row in buildings %}<option value="{{ row.id }}" {% if current_args.get('building_id', '')|int==row.id %}selected{% endif %}>{{ row.short_name or row.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <select class="form-select" name="class_id">
        <option value="">Класс</option>
        {% for row in classes %}<option value="{{ row.id }}" {% if current_args.get('class_id', '')|int==row.id %}selected{% endif %}>{{ row.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-2">
      <select class="form-select" name="visibility_level">
        <option value="">Уровень видимости</option>
        {% for value, title in visibility_choices %}<option value="{{ value }}" {% if request.args.get('visibility_level')==value %}selected{% endif %}>{{ title }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-2 d-grid"><button class="btn btn-outline-primary">Применить</button></div>
    <div class="col-md-2 d-grid"><a class="btn btn-outline-secondary" href="{{ request.path }}">Сбросить</a></div>
  </div>
  {% if can_manage %}
  <div class="form-check mt-2">
    <input class="form-check-input" type="checkbox" name="show_archived" value="1" id="showArchived" {% if request.args.get('show_archived')=='1' %}checked{% endif %}>
    <label class="form-check-label" for="showArchived">Показывать архивные записи</label>
  </div>
  {% endif %}
</form>
