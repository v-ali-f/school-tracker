{% extends "layout.html" %}
{% block content %}
<div class="page-head mb-3">
  <div><h1 class="page-title">Добавить пользователя</h1></div>
  <div class="page-actions"><a class="btn btn-outline-secondary btn-sm" href="/admin/users">Назад</a></div>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" style="max-width:520px;">

<div class="mb-2">
  <label class="form-label">Фамилия</label>
  <input class="form-control" name="last_name" required>
</div>

<div class="mb-2">
  <label class="form-label">Имя</label>
  <input class="form-control" name="first_name" required>
</div>

<div class="mb-2">
  <label class="form-label">Отчество</label>
  <input class="form-control" name="middle_name">
</div>

<div class="mb-2">
  <label class="form-label">Телефон</label>
  <input class="form-control" name="phone" placeholder="+7...">
</div>

<div class="mb-2">
  <label class="form-label">Логин</label>
  <input class="form-control" name="username" required>
</div>

<div class="mb-2">
  <label class="form-label">Пароль</label>
  <input class="form-control" name="password" type="password" required>
</div>

<div class="mb-3">
  <label class="form-label">Роль</label>
  <select class="form-select" name="role">
    {% for r in roles %}
    <option value="{{ r }}">{{ role_labels.get(r, r) }}</option>
    {% endfor %}
  </select>
</div>

<button class="btn btn-primary">Создать</button>

    </form>
  </div>
</div>

{% endblock %}
