{% extends "workspace_layout.html" %}
{% block workspace_head_extra %}<link rel="stylesheet" href="{{ url_for('static', filename='css/appeals_card.css') }}?v=20261009_3">{% endblock %}
{% block workspace_content %}
<div class="appeals-workspace appeals-editor ws-stack">
  <form method="post" enctype="multipart/form-data" class="ws-stack appeals-form">
    <section class="ws-card" aria-label="Основные сведения обращения">
      <div class="ws-card-body row g-3">
        <div class="col-md-6"><label class="form-label" for="applicant_name">Заявитель / организация</label><input id="applicant_name" class="form-control" name="applicant_name" required></div>
        <div class="col-md-6"><label class="form-label" for="subject">Тема</label><input id="subject" class="form-control" name="subject" required></div>
        <div class="col-12"><label class="form-label" for="description">Содержание обращения</label><textarea id="description" class="form-control" rows="5" name="description"></textarea></div>
      </div>
    </section>
    {% include '_appeal_responsibles.html' %}
    <section class="ws-card">
      <header class="ws-card-header"><div><h2 class="ws-section-title">Файлы</h2><div class="ws-section-subtitle">Документы к обращению</div></div></header>
      <div class="ws-card-body">
        <label class="form-label" for="attachments">Прикрепить файлы</label>
        <input id="attachments" class="form-control" type="file" name="attachments" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.zip,.txt">
        <div class="ws-field-help">Файлы появятся в карточке после сохранения.</div>
      </div>
    </section>
    <details class="ws-card appeals-extra">
      <summary class="ws-card-header"><span class="ws-section-title">Дополнительные параметры</span><i class="bi bi-chevron-down" aria-hidden="true"></i></summary>
      <div class="ws-card-body row g-3">
        <div class="col-md-3"><label class="form-label" for="number">Номер</label><input id="number" class="form-control" name="number"></div>
        <div class="col-md-3"><label class="form-label" for="received_at">Дата поступления</label><input id="received_at" class="form-control" type="date" name="received_at"></div>
        <div class="col-md-3"><label class="form-label" for="channel">Канал</label><select id="channel" class="form-select" name="channel"><option value="">—</option>{% for c in channels %}<option value="{{ c }}">{{ c }}</option>{% endfor %}</select></div>
        <div class="col-md-3"><label class="form-label" for="deadline_at">Срок ответа</label><input id="deadline_at" class="form-control" type="date" name="deadline_at"></div>
        <div class="col-md-6"><label class="form-label" for="applicant_contact">Контакты заявителя</label><input id="applicant_contact" class="form-control" name="applicant_contact"></div>
        <div class="col-md-3"><label class="form-label" for="status">Статус</label><select id="status" class="form-select" name="status">{% for s in statuses %}<option value="{{ s }}">{{ s }}</option>{% endfor %}</select></div>
        <div class="col-md-3 d-flex align-items-end"><label class="form-check"><input class="form-check-input" type="checkbox" name="create_task" value="1" checked><span class="form-check-label">Создать задачу ответственному</span></label></div>
      </div>
    </details>
    <div class="ws-action-bar appeals-actions">
      <a class="btn btn-outline-secondary" href="{{ url_for('appeals.index') }}">Отмена</a>
      <button type="submit" class="btn btn-primary">Сохранить обращение</button>
    </div>
  </form>
</div>
<script src="{{ url_for('static', filename='js/appeals_form.js') }}?v=20261009_2"></script>
{% endblock %}
