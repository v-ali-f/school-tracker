{% extends "layout.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3 flex-wrap gap-2"><div><h4 class="mb-0"><i class="bi bi-file-earmark-plus"></i> Новое ознакомление</h4><div class="text-muted small">Направьте приказ, письмо или документ сотрудникам с фиксацией ознакомления.</div></div><a class="btn btn-outline-secondary btn-sm" href="{{ url_for('familiarizations.index') }}">Назад</a></div>
<form method="post" enctype="multipart/form-data" class="card border-0 shadow-sm rounded-4"><div class="card-body"><div class="row g-3"><div class="col-md-8"><label class="form-label">Тема документа</label><input class="form-control" name="title" required></div><div class="col-md-4"><label class="form-label">Срок ознакомления</label><input type="datetime-local" class="form-control" name="deadline_at"></div><div class="col-12"><label class="form-label">Описание / комментарий</label><textarea class="form-control" name="description" rows="3"></textarea></div><div class="col-12"><label class="form-label">Файл приказа/письма</label><input type="file" class="form-control" name="document"></div><div class="col-12"><label class="form-label">Получатели</label><div class="border rounded-4 p-3 bg-light"><input type="text" class="form-control form-control-sm mb-2 js-user-search" placeholder="Поиск по ФИО, логину или роли"><div class="small text-muted mb-2">Отметьте сотрудников, которым нужно направить документ.</div><div style="max-height:320px;overflow:auto;">{% for u in users %}<label class="d-flex align-items-center gap-2 py-1 user-check-item" data-search="{{ ((u.fio or '') ~ ' ' ~ (u.full_name or '') ~ ' ' ~ (u.username or '') ~ ' ' ~ (u.role or ''))|lower }}"><input type="checkbox" class="form-check-input m-0" name="recipient_user_ids" value="{{ u.id }}"><span>{{ u.fio or u.full_name or u.username }}</span>{% if u.role %}<span class="text-muted small">({{ u.role }})</span>{% endif %}</label>{% endfor %}</div></div></div></div></div><div class="card-footer bg-white d-flex justify-content-end gap-2"><a class="btn btn-outline-secondary" href="{{ url_for('familiarizations.index') }}">Отмена</a><button class="btn btn-primary">Направить на ознакомление</button></div></form>
<script>document.addEventListener('DOMContentLoaded',function(){document.querySelectorAll('.js-user-search').forEach(function(input){const box=input.closest('.border');if(!box)return;const items=box.querySelectorAll('.user-check-item');input.addEventListener('input',function(){const q=input.value.trim().toLowerCase();items.forEach(function(item){const t=item.dataset.search||item.textContent.toLowerCase();item.style.display=t.includes(q)?'':'none';});});});});</script>
{% endblock %}
