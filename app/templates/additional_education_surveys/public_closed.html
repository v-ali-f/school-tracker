<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Приём ответов завершён — {{ org_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width:720px">
  <div class="d-flex align-items-center gap-3 mb-3">
    {% if org_emblem_url or org_logo_url %}<img src="{{ org_emblem_url or org_logo_url }}" alt="Эмблема {{ org_name }}" style="width:56px;height:56px;object-fit:contain">{% endif %}
    <div><strong class="text-primary">{{ org_name }}</strong><div class="small text-muted">Форма сбора</div></div>
  </div>
  <div class="card border-0 shadow-sm rounded-4"><div class="card-body p-4 p-md-5">
    <h1 class="h3">Приём ответов завершён</h1>
    <p class="text-muted mb-0">Форма «{{ survey.title }}» сейчас закрыта. Уточните сроки у сотрудника, который отправил вам ссылку.</p>
  </div></div>
</main>
</body>
</html>
