<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ответ отправлен — {{ org_name }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width:720px">
  <div class="d-flex align-items-center justify-content-center gap-3 mb-3">
    {% if org_emblem_url or org_logo_url %}<img src="{{ org_emblem_url or org_logo_url }}" alt="Эмблема {{ org_name }}" style="width:56px;height:56px;object-fit:contain">{% endif %}
    <strong>{{ org_name }}</strong>
  </div>
  <div class="card border-0 shadow-sm rounded-4"><div class="card-body p-4 p-md-5 text-center">
    <div class="display-5 text-success mb-3">✓</div>
    <h1 class="h3">Ответ отправлен</h1>
    <p class="text-muted mb-0">Спасибо. Ответ на форму «{{ survey.title }}» сохранён.</p>
  </div></div>
</main>
</body>
</html>
