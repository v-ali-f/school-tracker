{% extends "layout.html" %}
{% block content %}

<div class="page-head">
  <div>
    <h1 class="page-title">Импорт родителей</h1>
    <div class="page-sub">Загрузка представителей и привязка к уже существующим детям</div>
  </div>
  <div class="page-actions">
    <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('children.list_children') }}"><i class="bi bi-arrow-left me-1"></i>Назад</a>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form method="post" enctype="multipart/form-data">
      <div class="mb-3">
        <label class="form-label">Excel-файл родителей</label>
        <input type="file" name="file" class="form-control" accept=".xlsx,.xls" required>
      </div>

      <div class="alert alert-light border">
        <div><b>Обязательные колонки:</b></div>
        <div class="small mt-2">
          ФИО, Дата рождения, Тип представителя, ФИО представителя, Телефон представителя, E-mail представителя
        </div>
      </div>

      <button class="btn btn-primary">Загрузить</button>
    </form>
  </div>
</div>

{% endblock %}
