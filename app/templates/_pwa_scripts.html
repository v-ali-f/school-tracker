<script>
(function () {
  var state = {
    manifestUrl: {{ pwa_manifest_url | tojson }},
    serviceWorkerUrl: {{ pwa_service_worker_url | tojson }},
    notificationsUrl: {{ pwa_notifications_url | tojson }},
    pushRegisterUrl: {{ pwa_push_register_url | tojson }},
    badgePollIntervalMs: {{ pwa_badge_poll_interval_ms | tojson }},
    firebaseConfig: {{ pwa_firebase_config | tojson }},
    firebaseVapidKey: {{ pwa_firebase_vapid_key | tojson }},
    firebaseReady: {{ pwa_firebase_ready | tojson }},
    installPrompt: null,
    registration: null,
    lastUnreadCount: null,
    refreshTimer: null,
    deviceIdKey: "altair-pwa-device-id-v1",
    standalone: false,
  };

  function isStandalone() {
    if (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) {
      return true;
    }
    return window.navigator.standalone === true;
  }

  function isTouchDevice() {
    return ("ontouchstart" in window) || (navigator.maxTouchPoints || 0) > 0;
  }

  function isMobileViewport() {
    return window.innerWidth <= 760;
  }

  function detectPlatform() {
    var ua = (navigator.userAgent || "").toLowerCase();
    return {
      ios: /iphone|ipad|ipod/.test(ua),
      android: /android/.test(ua),
      touch: isTouchDevice(),
      mobileViewport: isMobileViewport(),
    };
  }

  state.standalone = isStandalone();

  function syncShellMode() {
    state.standalone = isStandalone();
    if (document.body) {
      document.body.classList.toggle("altair-standalone", state.standalone);
    }
  }

  function syncClientMode() {
    if (!document.body) return;
    var platform = detectPlatform();
    var mobileClient = platform.mobileViewport || platform.touch;
    document.body.classList.toggle("altair-mobile-client", mobileClient);
    document.body.classList.toggle("altair-desktop-client", !mobileClient);
    document.body.classList.toggle("altair-ios-client", platform.ios);
    document.body.classList.toggle("altair-android-client", platform.android);
  }

  function syncKeyboardState() {
    if (!document.body) return;
    var viewport = window.visualViewport;
    var compactScreen = window.innerWidth <= 760;
    if (!viewport || !compactScreen) {
      document.body.classList.remove("altair-keyboard-open");
      return;
    }
    var heightDelta = Math.max(0, window.innerHeight - viewport.height);
    document.body.classList.toggle("altair-keyboard-open", heightDelta > 160);
  }

  syncShellMode();
  syncClientMode();
  syncKeyboardState();

  function getDeviceId() {
    try {
      var existing = window.localStorage.getItem(state.deviceIdKey);
      if (existing) return existing;
      var created = (window.crypto && window.crypto.randomUUID)
        ? window.crypto.randomUUID()
        : "pwa-" + Date.now() + "-" + Math.random().toString(36).slice(2, 10);
      window.localStorage.setItem(state.deviceIdKey, created);
      return created;
    } catch (_) {
      return "pwa-ephemeral";
    }
  }

  function emitStatus() {
    document.dispatchEvent(new CustomEvent("altair:pwa-status", {
      detail: window.AltairPwa.getStatus(),
    }));
  }

  function renderModeStrip() {
    if (!window.AltairPwa) return;
    var root = document.getElementById("appModeStrip");
    if (!root) return;
    var eyebrow = document.getElementById("appModeEyebrow");
    var text = document.getElementById("appModeText");
    var installBtn = document.getElementById("appModeInstallAction");
    var status = window.AltairPwa.getStatus();
    var show = status.mobileClient || status.standalone;

    root.hidden = !show;
    if (!show) return;

    if (eyebrow) {
      eyebrow.textContent = status.standalone ? "Режим приложения" : "Мобильный доступ";
    }

    if (text) {
      if (status.standalone) {
        text.textContent = "Портал открыт как приложение: нижняя навигация, push и быстрый доступ уже работают как в мобильном режиме.";
      } else if (status.installAvailable) {
        text.textContent = "Портал можно установить на главный экран, чтобы он открывался почти как отдельное приложение.";
      } else {
        text.textContent = "Сейчас открыт мобильный браузерный режим. После установки запуск будет быстрее и привычнее.";
      }
    }

    if (installBtn) {
      installBtn.hidden = !status.installAvailable || status.standalone;
      installBtn.disabled = !status.installAvailable;
    }
  }

  async function applyBadge(count) {
    var normalized = Number(count) || 0;
    state.lastUnreadCount = normalized;
    if (!("navigator" in window)) {
      emitStatus();
      return normalized;
    }
    try {
      if (normalized > 0 && typeof navigator.setAppBadge === "function") {
        await navigator.setAppBadge(normalized);
      } else if (normalized <= 0 && typeof navigator.clearAppBadge === "function") {
        await navigator.clearAppBadge();
      }
    } catch (_) {}
    emitStatus();
    return normalized;
  }

  async function refreshBadge() {
    if (!window.isSecureContext) {
      emitStatus();
      return 0;
    }
    try {
      var response = await fetch(state.notificationsUrl, {
        headers: {"Accept": "application/json"},
        credentials: "same-origin",
      });
      if (!response.ok) {
        emitStatus();
        return state.lastUnreadCount || 0;
      }
      var payload = await response.json();
      var unread = Number(payload && payload.counts && payload.counts.total);
      if (!Number.isFinite(unread)) {
        unread = Number(payload && payload.unread) || 0;
      }
      return await applyBadge(unread);
    } catch (_) {
      emitStatus();
      return state.lastUnreadCount || 0;
    }
  }

  async function registerServiceWorker() {
    if (!("serviceWorker" in navigator) || !window.isSecureContext) {
      emitStatus();
      return null;
    }
    if (state.registration) {
      return state.registration;
    }
    try {
      state.registration = await navigator.serviceWorker.register(state.serviceWorkerUrl, {scope: "/"});
      navigator.serviceWorker.addEventListener("message", function (event) {
        var detail = event && event.data ? event.data : {};
        if (detail && detail.type === "ALTair_PWA_BADGE_SYNC") {
          applyBadge(detail.unreadCount);
        }
        if (detail && detail.type === "ALTair_PWA_REFRESH_BADGE") {
          refreshBadge();
        }
      });
      emitStatus();
      return state.registration;
    } catch (_) {
      emitStatus();
      return null;
    }
  }

  var firebaseModulesPromise = null;
  async function loadFirebaseMessaging() {
    if (!state.firebaseReady) {
      throw new Error("firebase-not-configured");
    }
    if (!firebaseModulesPromise) {
      firebaseModulesPromise = Promise.all([
        import("https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js"),
        import("https://www.gstatic.com/firebasejs/11.0.1/firebase-messaging.js"),
      ]).then(function (modules) {
        var appModule = modules[0];
        var messagingModule = modules[1];
        var app = appModule.initializeApp(state.firebaseConfig, "altair-pwa");
        return {
          messaging: messagingModule.getMessaging(app),
          getToken: messagingModule.getToken,
          onMessage: messagingModule.onMessage,
        };
      });
    }
    return firebaseModulesPromise;
  }

  async function registerWebPush() {
    if (!state.firebaseReady || !window.isSecureContext || !("Notification" in window)) {
      emitStatus();
      return {ok: false, reason: "unsupported"};
    }
    if (Notification.permission !== "granted") {
      emitStatus();
      return {ok: false, reason: "permission-denied"};
    }
    try {
      var registration = await registerServiceWorker();
      if (!registration) {
        return {ok: false, reason: "service-worker-failed"};
      }
      var firebase = await loadFirebaseMessaging();
      var token = await firebase.getToken(firebase.messaging, {
        vapidKey: state.firebaseVapidKey,
        serviceWorkerRegistration: registration,
      });
      if (!token) {
        emitStatus();
        return {ok: false, reason: "empty-token"};
      }
      await fetch(state.pushRegisterUrl, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json",
        },
        body: JSON.stringify({
          token: token,
          platform: "web",
          device_id: getDeviceId(),
          app_version: "pwa",
        }),
      });
      if (!state._messageHooked) {
        firebase.onMessage(firebase.messaging, function (payload) {
          var unread = payload && payload.data ? payload.data.unread_count : 0;
          applyBadge(unread);
        });
        state._messageHooked = true;
      }
      emitStatus();
      return {ok: true, token: token};
    } catch (error) {
      console.warn("PWA push setup failed", error);
      emitStatus();
      return {ok: false, reason: "registration-error"};
    }
  }

  async function requestPushPermission() {
    if (!("Notification" in window)) {
      emitStatus();
      return {ok: false, reason: "notification-unsupported"};
    }
    var permission = await Notification.requestPermission();
    if (permission !== "granted") {
      emitStatus();
      return {ok: false, reason: permission};
    }
    return registerWebPush();
  }

  async function showInstallPrompt() {
    if (!state.installPrompt) {
      emitStatus();
      return false;
    }
    var prompt = state.installPrompt;
    state.installPrompt = null;
    await prompt.prompt();
    try {
      await prompt.userChoice;
    } catch (_) {}
    emitStatus();
    return true;
  }

  function getStatus() {
    var platform = detectPlatform();
    var mobileClient = platform.mobileViewport || platform.touch;
    return {
      secureContext: window.isSecureContext,
      serviceWorkerSupported: "serviceWorker" in navigator,
      badgeSupported: typeof navigator.setAppBadge === "function" || typeof navigator.clearAppBadge === "function",
      notificationSupported: "Notification" in window,
      notificationPermission: ("Notification" in window) ? Notification.permission : "unsupported",
      firebaseReady: state.firebaseReady,
      standalone: isStandalone(),
      installAvailable: Boolean(state.installPrompt),
      unreadCount: state.lastUnreadCount || 0,
      ios: platform.ios,
      android: platform.android,
      mobileClient: mobileClient,
      desktopClient: !mobileClient,
    };
  }

  window.AltairPwa = {
    state: state,
    applyBadge: applyBadge,
    refreshBadge: refreshBadge,
    registerServiceWorker: registerServiceWorker,
    registerWebPush: registerWebPush,
    requestPushPermission: requestPushPermission,
    showInstallPrompt: showInstallPrompt,
    getStatus: getStatus,
  };

  window.addEventListener("beforeinstallprompt", function (event) {
    event.preventDefault();
    state.installPrompt = event;
    emitStatus();
    renderModeStrip();
  });

  window.addEventListener("appinstalled", function () {
    state.installPrompt = null;
    state.standalone = true;
    syncShellMode();
    syncClientMode();
    emitStatus();
    renderModeStrip();
  });

  window.addEventListener("resize", function () {
    syncShellMode();
    syncClientMode();
    syncKeyboardState();
    emitStatus();
    renderModeStrip();
  });

  window.addEventListener("pageshow", function () {
    syncShellMode();
    syncClientMode();
    syncKeyboardState();
    emitStatus();
    renderModeStrip();
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", syncKeyboardState);
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      refreshBadge();
    }
  });

  window.addEventListener("focus", function () {
    refreshBadge();
  });

  registerServiceWorker().then(function () {
    refreshBadge();
    if (state.firebaseReady && "Notification" in window && Notification.permission === "granted") {
      registerWebPush();
    }
    if (!state.refreshTimer) {
      state.refreshTimer = window.setInterval(refreshBadge, state.badgePollIntervalMs);
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    syncShellMode();
    syncClientMode();
    syncKeyboardState();
    emitStatus();
    renderModeStrip();
    var installBtn = document.getElementById("appModeInstallAction");
    if (installBtn) {
      installBtn.addEventListener("click", async function () {
        await showInstallPrompt();
        renderModeStrip();
      });
    }
  }, {once: true});
})();
</script>
