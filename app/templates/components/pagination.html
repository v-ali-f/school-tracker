{% if pagination %}
<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mt-3">
  <div class="small text-muted">
    Показано {{ pagination.first_item }}-{{ pagination.last_item }} из {{ pagination.total }} записей
  </div>
  <div class="d-flex align-items-center gap-2 flex-wrap">
    <form method="get" class="d-flex align-items-center gap-2">
      {% for key, value in request.args.items() %}
        {% if key not in ['per_page', 'page'] %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endif %}
      {% endfor %}
      <label class="small text-muted">Строк</label>
      <select class="form-select form-select-sm" name="per_page" onchange="this.form.submit()">
        {% for option in [20, 30, 50, 100, 'all'] %}
        <option value="{{ option }}" {% if pagination.per_page|string == option|string %}selected{% endif %}>{{ option }}</option>
        {% endfor %}
      </select>
      <input type="hidden" name="page" value="1">
    </form>
    <div class="btn-group btn-group-sm" role="group">
      <a class="btn btn-outline-secondary {% if not pagination.has_prev %}disabled{% endif %}" href="?{{ request.args|replace_query(page=1) }}">«</a>
      <a class="btn btn-outline-secondary {% if not pagination.has_prev %}disabled{% endif %}" href="?{{ request.args|replace_query(page=pagination.prev_num) }}">‹</a>
      <span class="btn btn-light disabled">{{ pagination.page }} / {{ pagination.pages }}</span>
      <a class="btn btn-outline-secondary {% if not pagination.has_next %}disabled{% endif %}" href="?{{ request.args|replace_query(page=pagination.next_num) }}">›</a>
      <a class="btn btn-outline-secondary {% if not pagination.has_next %}disabled{% endif %}" href="?{{ request.args|replace_query(page=pagination.pages) }}">»</a>
    </div>
  </div>
</div>
{% endif %}
